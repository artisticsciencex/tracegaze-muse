<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="420" viewBox="0 0 1760 420" font-family="Noto Sans, Helvetica, Arial, sans-serif"><rect width="1760" height="420" fill="#ffffff"/><rect x="15" y="60" width="255" height="230" rx="16" fill="none" stroke="#8b96a3" stroke-width="3" stroke-dasharray="6 5"/><text x="142.5" y="112" text-anchor="middle" font-size="22" font-weight="700" fill="#17202a">Project Aria</text><text x="142.5" y="156" text-anchor="middle" font-size="19" fill="#4a5562">glasses: first-person</text><text x="142.5" y="187" text-anchor="middle" font-size="19" fill="#4a5562">video + eye tracking</text><path d="M276 175.0 h24" stroke="#4a5562" stroke-width="3"/><path d="M304 175.0 l-12 -8 v16 z" fill="#4a5562"/><rect x="310" y="60" width="255" height="230" rx="16" fill="none" stroke="#8b96a3" stroke-width="3"/><text x="437.5" y="112" text-anchor="middle" font-size="22" font-weight="700" fill="#17202a">SAM 3 (Meta)</text><text x="437.5" y="156" text-anchor="middle" font-size="19" fill="#4a5562">Tracks objects a</text><text x="437.5" y="187" text-anchor="middle" font-size="19" fill="#4a5562">researcher selected</text><text x="437.5" y="218" text-anchor="middle" font-size="19" fill="#4a5562">and reviewed</text><path d="M571 175.0 h24" stroke="#4a5562" stroke-width="3"/><path d="M599 175.0 l-12 -8 v16 z" fill="#4a5562"/><rect x="605" y="60" width="255" height="230" rx="16" fill="none" stroke="#8b96a3" stroke-width="3"/><text x="732.5" y="112" text-anchor="middle" font-size="22" font-weight="700" fill="#17202a">TraceGaze</text><text x="732.5" y="156" text-anchor="middle" font-size="19" fill="#4a5562">Gaze &#8594; object</text><text x="732.5" y="187" text-anchor="middle" font-size="19" fill="#4a5562">per sample; episodes,</text><text x="732.5" y="218" text-anchor="middle" font-size="19" fill="#4a5562">time per object</text><path d="M866 175.0 h24" stroke="#4a5562" stroke-width="3"/><path d="M894 175.0 l-12 -8 v16 z" fill="#4a5562"/><rect x="900" y="60" width="255" height="230" rx="16" fill="#e6eefb" stroke="#2f6fd1" stroke-width="3"/><text x="1027.5" y="112" text-anchor="middle" font-size="22" font-weight="700" fill="#17202a">Evidence package</text><text x="1027.5" y="156" text-anchor="middle" font-size="19" fill="#4a5562">Facts, key moments,</text><text x="1027.5" y="187" text-anchor="middle" font-size="19" fill="#4a5562">12 frames, edge flags,</text><text x="1027.5" y="218" text-anchor="middle" font-size="19" fill="#4a5562">source links</text><path d="M1161 175.0 h24" stroke="#4a5562" stroke-width="3"/><path d="M1189 175.0 l-12 -8 v16 z" fill="#4a5562"/><rect x="1195" y="60" width="255" height="230" rx="16" fill="#e6eefb" stroke="#2f6fd1" stroke-width="3"/><text x="1322.5" y="112" text-anchor="middle" font-size="22" font-weight="700" fill="#17202a">Muse Spark 1.3</text><text x="1322.5" y="156" text-anchor="middle" font-size="19" fill="#4a5562">Meta Model API</text><text x="1322.5" y="187" text-anchor="middle" font-size="19" fill="#4a5562">Typed findings:</text><text x="1322.5" y="218" text-anchor="middle" font-size="19" fill="#4a5562">measured, visible,</text><text x="1322.5" y="249" text-anchor="middle" font-size="19" fill="#4a5562">interpretation</text><path d="M1456 175.0 h24" stroke="#4a5562" stroke-width="3"/><path d="M1484 175.0 l-12 -8 v16 z" fill="#4a5562"/><rect x="1490" y="60" width="255" height="230" rx="16" fill="#e6eefb" stroke="#2f6fd1" stroke-width="3"/><text x="1617.5" y="112" text-anchor="middle" font-size="22" font-weight="700" fill="#17202a">Checks + dashboard</text><text x="1617.5" y="156" text-anchor="middle" font-size="19" fill="#4a5562">Every reference and</text><text x="1617.5" y="187" text-anchor="middle" font-size="19" fill="#4a5562">number verified;</text><text x="1617.5" y="218" text-anchor="middle" font-size="19" fill="#4a5562">click to the moment</text><rect x="15" y="340" width="26" height="26" rx="5" fill="none" stroke="#8b96a3" stroke-width="3"/><text x="55" y="362" font-size="